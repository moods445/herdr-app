# Intel Mac builds of the app, from this fork.
#
# The app builds from source on Intel exactly as README.md's "Build from
# source" says, so this runs those steps on an Intel runner and publishes
# what `just install` produced. Upstream's own pipeline ships macos-aarch64
# only and scripts/package refuses Intel on purpose, hence the separate
# workflow.
#
# Tags only, never a branch: it builds the release node itself, so the binary
# is upstream's released source with only these workflow files added (a tag
# can't trigger a workflow it doesn't contain). To build one, fetch upstream's
# tags and push the one you want:
#
#   git fetch --tags https://github.com/herdrdev/herdr-app.git
#   git push origin refs/tags/v0.1.12
#
# The result is attached to the tag's GitHub release here, never uploaded to
# releases.herdr.dev: the app reads that manifest, finds no macOS Intel build,
# and so never replaces itself with an arm64 download. New Intel builds come
# from this page.
name: macos-intel
run-name: macos intel ${{ format('release {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: false

env:
  # README.md: the versions CI uses.
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  # `just test` runs the script tests too.
  BUN_VERSION: 1.4.4
  # The arm64 release targets macOS 11; Intel matches it rather than rustc's
  # older default floor, so both downloads ask for the same system.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  intel:
    # An x64 runner: the README's build-from-source steps compile and run
    # natively, no cross-compiling.
    runs-on: macos-15-intel
    # The README builds three times (debug, tests, release for the install).
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install just and Bun
        run: |
          command -v just >/dev/null || brew install just
          # Bun's tags carry the v (ci.yml passes it the same way).
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Version matches the tag
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      # README.md, "Build from source".
      - name: just build
        run: just build
      - name: just test
        run: just test
      - name: just install
        run: just install
      # scripts/install-macos prepares the app for the machine it runs on: the
      # version is a placeholder, no licenses go in, and the PATH it writes is
      # this runner's. A download needs all three to fit every machine.
      - name: Pack the installed app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="$HOME/Applications/Herdr.app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" \
            -c "Set :CFBundleVersion $version" \
            -c "Set :LSEnvironment:PATH /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "$plist"
          cp LICENSE THIRD-PARTY-NOTICES "$app/Contents/Resources/"
          scripts/mac-sign "$app"
          codesign --verify --deep --strict "$app"

          archs=$(lipo -archs "$app/Contents/MacOS/Herdr")
          [ "$archs" = x86_64 ] || { echo "expected an Intel binary, got: $archs"; exit 1; }

          mkdir -p dist
          out="dist/herdr-app-macos-x86_64.tar.gz"
          tar -czf "$out" -C "$(dirname "$app")" Herdr.app
          # The notices and license travel with the app, unchanged.
          tar -xOf "$out" Herdr.app/Contents/Resources/THIRD-PARTY-NOTICES | cmp - THIRD-PARTY-NOTICES
          tar -xOf "$out" Herdr.app/Contents/Resources/LICENSE | cmp - LICENSE
          (cd dist && shasum -a 256 herdr-app-macos-x86_64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-macos-x86_64
          path: |
            dist/herdr-app-macos-x86_64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # The tag's GitHub release. Upstream's own release workflow publishes to its
  # download server; this one is the only place an Intel build exists.
  release:
    needs: intel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-macos-x86_64
          path: dist
      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          sum=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/notes.md"
          # Tilde fences: backticks need escaping inside an expanding heredoc.
          cat > "$notes" <<NOTES
          Intel (x86_64) build of Herdr $version for macOS 11 and later, built from the same sources as upstream's Apple Silicon release. Unofficial fork build: not signed with a Developer ID and not notarized.

          Install:

          ~~~sh
          mkdir -p ~/Applications
          tar -xzf herdr-app-macos-x86_64.tar.gz -C ~/Applications
          xattr -dr com.apple.quarantine ~/Applications/Herdr.app
          open ~/Applications/Herdr.app
          ~~~

          The app needs a herdr-core, which does ship an Intel build:

          ~~~sh
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          ~~~

          SHA-256: $sum

          Herdr looks for its own updates on releases.herdr.dev, which has no Intel Mac build, so it never replaces this copy: new versions appear on this page.
          NOTES

          # -R: this job checks nothing out, so gh can't find a repository.
          repo=(-R "$GITHUB_REPOSITORY")
          if gh release view "$tag" "${repo[@]}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/herdr-app-macos-x86_64.tar.gz dist/SHA256SUMS.txt --clobber "${repo[@]}"
            gh release edit "$tag" --notes-file "$notes" "${repo[@]}"
          else
            gh release create "$tag" dist/herdr-app-macos-x86_64.tar.gz dist/SHA256SUMS.txt \
              --title "Herdr $version (Intel Mac)" --notes-file "$notes" "${repo[@]}"
          fi
