# Intel Mac builds of the app, from this fork.
#
# The app builds from source on Intel exactly as README.md's "Build from
# source" says, so this runs those steps on an Intel runner and publishes
# what `just install` produced. Upstream's own pipeline ships macos-aarch64
# only and scripts/package refuses Intel on purpose, hence the separate
# workflow.
#
# Speed: the whole target/ and the cargo registry are cached, so a release
# starts from the previous one's tree instead of compiling gpui, ghostty and
# QuickJS again (a cold run took over an hour, a warm one about ten minutes).
# scripts/ci-sources keeps unchanged files fresh to Cargo, as release.yml
# does. Everything builds in the release profile: the app is what ships, so a
# separate debug tree (just build) and a debug test tree only cost time; the
# tests run against the release build instead.
#
# Tags only, never a branch: it builds the release node itself, so the binary
# is upstream's released source with only these workflow files added (a tag
# can't trigger a workflow it doesn't contain). To build one, fetch upstream's
# tags and push the one you want:
#
#   git fetch --tags https://github.com/herdrdev/herdr-app.git
#   git push origin refs/tags/v0.1.12
#
# The result is attached to the tag's GitHub release here, never uploaded to
# releases.herdr.dev: the app reads that manifest, finds no macOS Intel build,
# and so never replaces itself with an arm64 download. New Intel builds come
# from this page.
name: macos-intel
run-name: macos intel ${{ format('release {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: false

env:
  # README.md: the versions CI uses.
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  # The script tests (`just test`'s first half) run through Bun.
  BUN_VERSION: 1.4.4
  # The arm64 release targets macOS 11; Intel matches it rather than rustc's
  # older default floor, so both downloads ask for the same system.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # Incremental state only bloats the cache: a tag builds each commit once.
  CARGO_INCREMENTAL: "0"

jobs:
  intel:
    # An x64 runner: the README's build-from-source steps compile and run
    # natively, no cross-compiling.
    runs-on: macos-15-intel
    # One release build of the whole tree: a cold run is about 25 minutes, a
    # run off the cache below about ten.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Bun
        run: |
          # Bun's tags carry the v (ci.yml passes it the same way).
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Version matches the tag
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      # The whole target/, like release.yml: the vendored crates (gpui-kit,
      # taffy, ghostty) are the slow part, and a fresh checkout would
      # otherwise rebuild them all.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: intel-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            intel-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            intel-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      # Cargo judges files by time and a checkout makes them all new; this
      # gives the unchanged ones an old time so the cache is reused.
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      # README.md, "Build from source". `just install` is this script, run
      # directly so no brew install of just is needed.
      - name: just install
        run: bash scripts/install-macos
      - name: just test
        # Not a gate: upstream's suite is flaky on these runners (a lifecycle
        # test panics on an unrelated thread) and ci.yml already gates releases
        # on the platforms it ships. A failure still shows on the run.
        #
        # `just test` in the release profile: the tree above is already built,
        # so the Rust half only compiles the test harnesses (a debug tree would
        # be a second copy of every dependency).
        continue-on-error: true
        run: |
          bun test scripts/files.test.ts scripts/picker.test.ts scripts/agents.test.ts scripts/spaces.test.ts
          cargo test --release --locked
      # scripts/install-macos prepares the app for the machine it runs on: the
      # version is a placeholder, no licenses go in, and the PATH it writes is
      # this runner's. A download needs all three to fit every machine.
      - name: Pack the installed app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="$HOME/Applications/Herdr.app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" \
            -c "Set :CFBundleVersion $version" \
            -c "Set :LSEnvironment:PATH /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "$plist"
          cp LICENSE THIRD-PARTY-NOTICES "$app/Contents/Resources/"
          scripts/mac-sign "$app"
          codesign --verify --deep --strict "$app"

          archs=$(lipo -archs "$app/Contents/MacOS/Herdr")
          [ "$archs" = x86_64 ] || { echo "expected an Intel binary, got: $archs"; exit 1; }

          mkdir -p dist
          out="dist/herdr-app-macos-x86_64.tar.gz"
          tar -czf "$out" -C "$(dirname "$app")" Herdr.app
          # The notices and license travel with the app, unchanged.
          tar -xOf "$out" Herdr.app/Contents/Resources/THIRD-PARTY-NOTICES | cmp - THIRD-PARTY-NOTICES
          tar -xOf "$out" Herdr.app/Contents/Resources/LICENSE | cmp - LICENSE
          (cd dist && shasum -a 256 herdr-app-macos-x86_64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      # Note the sources this tree came from, then keep it for the next tag.
      # A rerun of the same tag hits the exact key and saves nothing.
      - name: Note the sources the cache was built from
        run: scripts/ci-sources record
      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: intel-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-macos-x86_64
          path: |
            dist/herdr-app-macos-x86_64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # The tag's GitHub release. Upstream's own release workflow publishes to its
  # download server; this one is the only place an Intel build exists.
  release:
    needs: intel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-macos-x86_64
          path: dist
      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          sum=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/notes.md"
          # Tilde fences: backticks need escaping inside an expanding heredoc.
          cat > "$notes" <<NOTES
          Intel (x86_64) build of Herdr $version for macOS 11 and later, built from the same sources as upstream's Apple Silicon release. Unofficial fork build: not signed with a Developer ID and not notarized.

          Install:

          ~~~sh
          mkdir -p ~/Applications
          tar -xzf herdr-app-macos-x86_64.tar.gz -C ~/Applications
          xattr -dr com.apple.quarantine ~/Applications/Herdr.app
          open ~/Applications/Herdr.app
          ~~~

          The app needs a herdr-core, which does ship an Intel build:

          ~~~sh
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          ~~~

          SHA-256: $sum

          Herdr looks for its own updates on releases.herdr.dev, which has no Intel Mac build, so it never replaces this copy: new versions appear on this page.
          NOTES

          # -R: this job checks nothing out, so gh can't find a repository.
          repo=(-R "$GITHUB_REPOSITORY")
          if gh release view "$tag" "${repo[@]}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/herdr-app-macos-x86_64.tar.gz dist/SHA256SUMS.txt --clobber "${repo[@]}"
            gh release edit "$tag" --notes-file "$notes" "${repo[@]}"
          else
            gh release create "$tag" dist/herdr-app-macos-x86_64.tar.gz dist/SHA256SUMS.txt \
              --title "Herdr $version (Intel Mac)" --notes-file "$notes" "${repo[@]}"
          fi
